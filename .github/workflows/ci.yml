name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install and test user-app
        run: |
          cd user-app
          npm ci
          npm run test
          npm run lint
          npm run build

      - name: Install and build admin-panel
        run: |
          cd admin-panel
          npm ci
          npm run lint
          npm run build
